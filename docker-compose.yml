services:
  hailo-ollama:
    build:
      context: .
      dockerfile: Dockerfile
      platform: linux/arm64
    image: hailo-ollama:5.1.1
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    devices:
      - "${HAILO_DEVICE:-/dev/hailo0}:${HAILO_DEVICE:-/dev/hailo0}:rw"
    expose:
      - "8000"
    volumes:
      - hailo-model-blobs:/usr/share/hailo-ollama/models/blob
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --output
        - /dev/null
        - http://127.0.0.1:8000/api/version
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  hailo-model-blobs:
